<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rumo | Acesse sua conta</title>

    <link
        rel="stylesheet"
        href="acesso.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

</head>

<body>

    <main class="pagina-acesso">

        <a
            href="index.html"
            class="logo-acesso"
        >
            RUMO <span>➜</span>
        </a>

        <section class="acesso-conteudo">

            <div class="acesso-texto">

                <p class="acesso-subtitulo">
                    BEM-VINDO AO SEU
                </p>

                <h1>
                    PRÓXIMO <span>RUMO</span>
                </h1>

                <p class="acesso-descricao">
                    Entre na sua conta para planejar viagens,
                    salvar seus destinos favoritos e viver
                    novas experiências.
                </p>

            </div>

            <div class="acesso-card">

                <div class="acesso-icone">
                    <i class="fa-solid fa-plane"></i>
                </div>

                <h2>
                    Acesse sua conta
                </h2>

                <p>
                    Entre para continuar sua jornada
                    com a RUMO.
                </p>

                <a
                    href="login.html"
                    class="btn-acesso btn-entrar-acesso"
                >
                    Entrar
                </a>

                <a
                    href="cadastro.html"
                    class="btn-acesso btn-criar-conta"
                >
                    Criar conta
                </a>

            </div>

        </section>

    </main>

</body>

</html>
