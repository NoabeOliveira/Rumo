<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rumo | Meus favoritos</title>

    <link
        rel="stylesheet"
        href="favoritos.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

</head>

<body>

    <main class="pagina-favoritos">

        <header class="favoritos-header">

            <a
                href="index.html"
                class="logo"
            >
                RUMO <span>➜</span>
            </a>

            <a
                href="index.html"
                class="btn-voltar"
            >
                <i class="fa-solid fa-arrow-left"></i>
                Voltar para o início
            </a>

        </header>

        <section class="favoritos-conteudo">

    <div class="favoritos-card">

        <p class="favoritos-subtitulo">
            SEUS DESTINOS
        </p>

        <h1>
            Meus favoritos
            <i class="fa-regular fa-heart"></i>
        </h1>

        <p class="favoritos-descricao">
            Os destinos que você salvar aparecerão aqui.
        </p>

        <div
            class="lista-favoritos"
            id="listaFavoritos"
        >
        </div>

        <div
            class="favoritos-vazio"
            id="favoritosVazio"
        >

            <i class="fa-regular fa-heart"></i>

            <h2>
                Nenhum destino favorito ainda
            </h2>

            <p>
                Explore os destinos da RUMO e salve
                aqueles que você gostaria de conhecer.
            </p>

            <a
                href="index.html#destinos"
                class="btn-explorar"
            >
                Explorar destinos
            </a>

        </div>

    </div>

</section>




    </main>

    <script src="favoritos.js"></script>

</body>

</html>
