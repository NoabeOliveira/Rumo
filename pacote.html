<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rumo | Detalhes do pacote</title>

    <link
        rel="stylesheet"
        href="pacote.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
</head>

<body>

    <header class="pacote-header">

        <a href="index.html" class="logo">
            RUMO <span>➜</span>
        </a>

        <a href="index.html#destinos" class="btn-voltar">
            <i class="fa-solid fa-arrow-left"></i>
            Voltar para destinos
        </a>

    </header>


    <main>
        <section class="pacote-hero">

            <img
                id="pacoteImagem"
                src=""
                alt=""
            >

            <div class="pacote-overlay"></div>

            <div class="pacote-hero-conteudo">

                <span class="pacote-tag">
                    PACOTE DE VIAGEM
                </span>

                <h1 id="pacoteNome">
                    Destino
                </h1>

                <p id="pacotePais">
                    País
                </p>

            </div>

        </section>

        <section class="pacote-detalhes">

            <div class="pacote-informacoes">

                <span class="secao-tag">
                    SUA PRÓXIMA EXPERIÊNCIA
                </span>

                <h2>
                    Sobre este pacote
                </h2>

                <p id="pacoteDescricao">
                    Informações sobre o pacote selecionado.
                </p>


                <div class="beneficios">

                    <div class="beneficio">
                        <i class="fa-solid fa-calendar-days"></i>

                        <div>
                            <span>Duração</span>
                            <strong id="pacoteDuracao">--</strong>
                        </div>
                    </div>


                    <div class="beneficio">
                        <i class="fa-solid fa-hotel"></i>

                        <div>
                            <span>Hospedagem</span>
                            <strong id="pacoteHospedagem">--</strong>
                        </div>
                    </div>


                    <div class="beneficio">
                        <i class="fa-solid fa-plane"></i>

                        <div>
                            <span>Transporte</span>
                            <strong id="pacoteTransporte">--</strong>
                        </div>
                    </div>

                </div>

            </div>

            <aside class="pacote-reserva">

                <span>
                    A partir de
                </span>

                <strong
                    class="pacote-preco"
                    id="pacotePreco"
                >
                    R$ 0
                </strong>

                <div class="pacote-avaliacao">

                    <i class="fa-solid fa-star"></i>

                    <span id="pacoteAvaliacao">
                        0.0
                    </span>

                </div>

               <a
    href="#"
    class="btn-reservar"
    id="btnReservar"
>
    Reservar pacote
    <i class="fa-solid fa-arrow-right"></i>
</a>

                <small>
                    Consulte disponibilidade antes de finalizar sua viagem.
                </small>

            </aside>

        </section>

    </main>


    <script src="pacote.js"></script>

</body>

</html>
